<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lora:wght@400;700&display=swap"
        rel="stylesheet">
</head>
<body>
<main class="container mt-5 mb-5 bg-white p-5 rounded-5 shadow-sm">
  <div class="container mt-5">
    <h2>Admin Chat</h2>
    <div id="chat-box" class="mb-3"></div>
    <input type="text" id="message-input" class="form-control" placeholder="Type a message...">
    <button id="send-btn" class="btn btn-success mt-2">Send</button>
  </div>
</main>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const chatId = urlParams.get('chat_id');
  const token = localStorage.getItem('jwtToken');

  if (!chatId || !token) {
    alert('Invalid chat session.');
    window.location.href = "admin.html";
  }

  const socket = new WebSocket(`ws://localhost:8080/ws?token=${token}&chat_id=${chatId}`);

  socket.onmessage = function(event) {
    const chatBox = document.getElementById('chat-box');
    const message = JSON.parse(event.data);
    chatBox.innerHTML += `<p><strong>${message.user_id === 0 ? "Admin" : "User " + message.user_id}:</strong> ${message.content}</p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  };

  document.getElementById('send-btn').addEventListener('click', () => {
    const input = document.getElementById('message-input');
    if (input.value.trim() !== '') {
      socket.send(JSON.stringify({ chat_id: chatId, content: input.value }));
      input.value = '';
    }
  });

</script>
</body>
</html>
