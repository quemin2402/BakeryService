<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lora:wght@400;700&display=swap"
        rel="stylesheet">
</head>
<body>
<main class="container mt-5 mb-5 bg-white p-5 rounded-5 shadow-sm">
  <div class="container mt-5">
    <h2>User Chat</h2>
    <div id="chat-box" class="mb-3"></div>
    <input type="text" id="message-input" class="form-control" placeholder="Type a message...">
    <button id="send-btn" class="btn btn-primary mt-2">Send</button>
  </div>
</main>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const chatId = urlParams.get('chat_id');
  const token = localStorage.getItem('jwtToken');

  console.log("Extracted chatId:", chatId);
  console.log("Extracted token:", token);

  if (!chatId || chatId === "null" || !token) {
    alert('Invalid chat session. Redirecting to profile.');
    window.location.href = "profile.html";
  }

  const socket = new WebSocket(`ws://localhost:8080/ws?token=${token}&chat_id=${chatId}`);

  socket.onopen = () => {
    console.log("WebSocket connected");
  };

  socket.onmessage = function(event) {
    const chatBox = document.getElementById('chat-box');
    const message = JSON.parse(event.data);
    if (message.ChatID != chatId) return;
    chatBox.innerHTML += `<div class="mb-2">
        <small class="text-muted">${new Date(message.Timestamp).toLocaleTimeString()}</small>
        <p class="mb-1">
            <strong class="text-${message.Role === 1 ? "success" : "primary"}">
                ${message.Role === 1 ? "Admin" : "User " + message.UserID}:
            </strong>
            ${message.Content}
        </p>
    </div>
`;
    chatBox.scrollTop = chatBox.scrollHeight;
  };

  document.getElementById('send-btn').addEventListener('click', () => {
    const input = document.getElementById('message-input');
    if (input.value.trim() !== '') {
      socket.send(JSON.stringify({ chat_id: chatId, content: input.value }));
      input.value = '';
    }
  });

  async function loadInitialMessages() {
    try {
      const response = await fetch(`/api/chat/messages?chat_id=${chatId}`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (!response.ok) {
        throw new Error('Failed to load messages');
      }

      const messages = await response.json();
      const chatBox = document.getElementById('chat-box');

      messages.forEach(message => {
        chatBox.innerHTML += `<div class="mb-2">
        <small class="text-muted">${new Date(message.Timestamp).toLocaleTimeString()}</small>
        <p class="mb-1">
            <strong class="text-${message.Role === 1 ? "success" : "primary"}">
                ${message.Role === 1 ? "Admin" : "User " + message.UserID}:
            </strong>
            ${message.Content}
        </p>
    </div>
`;      });

      chatBox.scrollTop = chatBox.scrollHeight;
    } catch (error) {
      console.error('Error loading messages:', error);
    }
  }

  loadInitialMessages();

</script>

</body>
</html>
